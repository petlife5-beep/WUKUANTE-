<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古拍立得照片牆 v3.0</title>
    <style>
        /* --- 基礎設定與背景 --- */
        body {
            margin: 0;
            padding: 0;
            /* 質感木紋背景 */
            background-color: #5d432c;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(#7a5c42 1px, transparent 0px);
            background-size: 50px 50px, 50px 50px, 10px 10px;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', "微軟正黑體", sans-serif;
            user-select: none;
        }

        /* --- 提示列 --- */
        .hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fcead6;
            font-size: 1rem;
            background: rgba(61, 38, 22, 0.8);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #8c6b52;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            pointer-events: none;
        }

        /* --- 相機整體結構 (尺寸加大) --- */
        .camera-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 340px; /* 加大寬度 */
            height: 320px; /* 加大高度 */
            z-index: 100;
        }

        /* 機身 (皮革質感) */
        .camera-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 260px;
            /* 復古棕色皮革漸層 */
            background: linear-gradient(to bottom, #7c593d, #4a3321);
            border-radius: 40px;
            /* 增加金屬邊框感和立體陰影 */
            box-shadow: 
                inset 0 0 0 5px #2c1e13, /* 內部縫線感 */
                inset 5px 5px 10px rgba(255,255,255,0.1),
                10px 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 裝飾彩條 (更復古的色調) */
        .camera-stripe {
            position: absolute;
            top: 60%;
            left: 0;
            width: 100%;
            height: 24px;
            background: linear-gradient(90deg, #c0392b 20%, #d35400 20%, #d35400 40%, #2980b9 40%, #2980b9 60%, #8e44ad 60%);
            opacity: 0.9;
            transform: translateY(-50%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 鏡頭組件 (加大並增加金屬反光) */
        .lens-wrapper {
            width: 160px;
            height: 160px;
            background: #222;
            border-radius: 50%;
            /* 金屬環繞效果 */
            border: 12px solid #d4af37; /* 金色邊框 */
            box-shadow: 
                0 0 0 5px #a38423, /* 外圈深金 */
                inset 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            z-index: 22;
            flex-shrink: 0;
        }

        /* 鏡頭玻璃反光 */
        .lens-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            /* 模擬鏡頭鍍膜反光 */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(100,149,237,0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        video#camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: sepia(0.2) contrast(1.1); /* 視訊本身帶點復古感 */
        }

        /* 閃光燈 (新增) */
        .flash-unit {
            width: 60px;
            height: 90px;
            background: #d4af37; /* 金屬底座 */
            border-radius: 10px;
            border: 3px solid #a38423;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            flex-shrink: 0;
            margin-left: 20px;
        }
        .flash-bulb {
            width: 40px;
            height: 50px;
            background: #eee; /* 燈泡白 */
            border-radius: 5px;
            margin: 10px auto;
            border: 2px solid #ccc;
            /* 燈泡紋理 */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0px, transparent 2px);
        }

        /* 快門按鈕 (金屬紅) */
        .shutter-btn {
            position: absolute;
            right: 30px;
            top: -25px; /* 突出更多 */
            width: 60px;
            height: 30px;
            /* 金屬紅漸層 */
            background: linear-gradient(to bottom, #ff5e5e, #c0392b);
            border: 3px solid #a31a0f;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 19;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
        }
        
        .shutter-btn:active {
            transform: translateY(8px);
            background: linear-gradient(to bottom, #c0392b, #a31a0f);
        }

        /* 出紙口 */
        .paper-slot {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 14px;
            background: #111;
            border-radius: 8px;
            border-bottom: 2px solid #333;
            z-index: 18;
        }

        /* --- 垃圾桶 (CSS Art) --- */
        .trash-can {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 100px;
            /* 金屬質感 */
            background: linear-gradient(to right, #7f8c8d, #bdc3c7, #7f8c8d);
            border-radius: 10px;
            border: 3px solid #5f6c6d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 90;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        /* 垃圾桶蓋子 */
        .trash-can::before {
            content: '';
            position: absolute;
            top: -15px;
            width: 90px;
            height: 20px;
            background: linear-gradient(to right, #7f8c8d, #bdc3c7);
            border-radius: 5px;
            border: 3px solid #5f6c6d;
            left: -8px;
        }
        /* 垃圾桶提把 */
        .trash-can::after {
             content: '';
            position: absolute;
            top: -25px;
            width: 30px;
            height: 15px;
            border-radius: 10px 10px 0 0;
            border: 4px solid #5f6c6d;
            border-bottom: none;
            left: 22px;
        }

        /* 垃圾桶圖示 */
        .trash-icon {
            font-size: 40px;
            color: #5f6c6d;
            opacity: 0.5;
        }

        /* 拖曳經過時的狀態 */
        .trash-can.drag-over {
            transform: scale(1.1);
            border-color: #e74c3c; /* 變紅色警告 */
            background: linear-gradient(to right, #c0392b, #e74c3c, #c0392b);
        }
        .trash-can.drag-over .trash-icon {
            color: #fff;
            opacity: 1;
        }


        /* --- 拍立得照片 (配合新尺寸調整) --- */
        .polaroid {
            position: absolute;
            width: 200px;  /* 加大 */
            height: 250px; /* 加大 */
            background: #fff;
            padding: 15px 15px 50px 15px; /* 加
