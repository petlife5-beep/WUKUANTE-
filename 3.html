<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Altróve - High Res Particle View</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000508;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* UI Controls */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        input[type="file"] { display: none; }

        .hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="hint">Touch to Interact · Upload DM</div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="controls">
        <label for="upload" class="btn">📷 上傳 DM</label>
        <input type="file" id="upload" accept="image/*">
        <button id="reset" class="btn">↺ 重置</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        // System Config
        let particles = [];
        let imgObj = null;
        let isInteracting = false;
        
        // Interaction Point
        const mouse = { x: 0, y: 0, radius: 100 };

        // Resize Logic
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(imgObj) initParticles();
        }
        window.addEventListener('resize', resize);

        // Interaction Listeners
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            isInteracting = true;
        });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            isInteracting = true;
        }, { passive: false });
        
        window.addEventListener('touchend', () => isInteracting = false);
        window.addEventListener('mouseout', () => isInteracting = false);

        /**
         * TEXTURE PARTICLE
         * Instead of a solid color, this particle draws a piece of the image.
         */
        class PuzzlePiece {
            constructor(x, y, size, imgX, imgY, imgW, imgH) {
                this.baseX = x;     // Resting screen position
                this.baseY = y;
                this.x = x;         // Current position
                this.y = y;
                
                // Texture Coordinates (Where on the source image to cut from)
                this.tx = imgX;
                this.ty = imgY;
                this.tw = imgW;
                this.th = imgH;
                
                this.size = size;
                this.density = (Math.random() * 30) + 1; // Different weight for each piece
                this.angle = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                ctx.rotate(this.angle);
                // The Magic: DrawImage instead of FillRect
                // This ensures full resolution inside the particle
                ctx.drawImage(
                    imgObj, 
                    this.tx, this.ty, this.tw, this.th, // Source Crop
                    -this.size/2, -this.size/2, this.size, this.size // Dest Draw
                );
                ctx.restore();
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                
                // Physics: Repel radius
                const maxDist = 120;
                let force = (maxDist - distance) / maxDist;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (isInteracting && distance < maxDist) {
                    this.x -= directionX * 2; // Push away strength
                    this.y -= directionY * 2;
                    this.angle = force * 0.5; // Rotate slightly when pushed
                } else {
                    // Return to origin (Snap back)
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10; // Ease factor
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                    // Reset rotation
                    if (this.angle !== 0) {
                        this.angle -= this.angle / 10;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            
            // 1. Fit Image to Screen (Contain)
            // Use a slight margin so it looks like a poster
            const margin = 0.9;
            const scale = Math.min(canvas.width / imgObj.width, canvas.height / imgObj.height) * margin;
            
            const displayW = imgObj.width * scale;
            const displayH = imgObj.height * scale;
            const startX = (canvas.width - displayW) / 2;
            const startY = (canvas.height - displayH) / 2;

            // 2. Determine Grid Size
            // Mobile needs fewer particles for 60fps, Desktop can handle more.
            // But since we use drawImage, we can use LARGER tiles without losing quality!
            // Let's use ~25 columns.
            const cols = 25; 
            const tileSize = displayW / cols;
            const rows = Math.ceil(displayH / tileSize);

            // 3. Create Particles
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = startX + c * tileSize;
                    const y = startY + r * tileSize;
                    
                    // Source Image Mapping
                    // We need to cut exactly the corresponding piece from the original high-res image
                    const srcX = c * (imgObj.width / cols);
                    const srcY = r * (imgObj.width / cols); // Assuming square tiles in source logic
                    const srcW = imgObj.width / cols;
                    const srcH = srcW; // Keep aspect logic simple
                    
                    // More precise mapping to avoid drift
                    const sX = c * (imgObj.width / cols);
                    const sY = r * (imgObj.height / rows);
                    const sW = imgObj.width / cols;
                    const sH = imgObj.height / rows;

                    // Only add if within bounds
                    if(sY < imgObj.height) {
                        particles.push(new PuzzlePiece(x, y, tileSize, sX, sY, sW, sH));
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // --- Init Logic ---
        
        // Default Image Generator (for demo)
        function createDefaultImage() {
            const tCan = document.createElement('canvas');
            const tCtx = tCan.getContext('2d');
            tCan.width = 600;
            tCan.height = 800;
            
            // Deep Blue gradient
            const grd = tCtx.createLinearGradient(0,0,0,800);
            grd.addColorStop(0, '#002');
            grd.addColorStop(1, '#057');
            tCtx.fillStyle = grd;
            tCtx.fillRect(0,0,600,800);
            
            // Text
            tCtx.fillStyle = 'white';
            tCtx.font = 'bold 80px serif';
            tCtx.textAlign = 'center';
            tCtx.fillText("WU KUAN TE", 300, 300);
            tCtx.font = '40px sans-serif';
            tCtx.fillText("Altróve", 300, 400);
            tCtx.font = '20px sans-serif';
            tCtx.fillStyle = '#aaa';
            tCtx.fillText("Please Upload Image", 300, 500);

            const img = new Image();
            img.src = tCan.toDataURL();
            img.onload = () => {
                imgObj = img;
                resize();
                animate();
            };
        }

        // Handle User Upload
        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imgObj = img;
                    initParticles(); // Rebuild grid with new image
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            if(imgObj) initParticles();
        });

        // Start
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createDefaultImage();

    </script>
</body>
</html>
