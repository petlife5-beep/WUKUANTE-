
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Altróve - Liquid Mosaic Interaction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #02111b; /* Dark Deep Blue */
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            touch-action: none; /* Prevent scrolling on mobile */
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Controls UI */
        .ui-layer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through */
            z-index: 10;
        }

        .controls {
            background: rgba(2, 17, 27, 0.85);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(128, 203, 196, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn {
            background: rgba(128, 203, 196, 0.1);
            color: #80cbc4;
            border: 1px solid #80cbc4;
            padding: 10px 24px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover, .btn:active {
            background: #80cbc4;
            color: #00251a;
            box-shadow: 0 0 15px rgba(128, 203, 196, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        .hint {
            color: #b2dfdb;
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(128, 203, 196, 0.3);
            border-radius: 50%;
            border-top-color: #80cbc4;
            animation: spin 1s ease-in-out infinite;
            display: none;
            z-index: 20;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Icon simulation */
        .icon-upload::before { content: '↑'; font-weight: bold; }
        .icon-reset::before { content: '↻'; font-weight: bold; }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>
    
    <div id="loader"></div>

    <div class="ui-layer">
        <div class="controls">
            <div class="hint">為獲得最佳效果，請上傳您的 DM 圖片</div>
            <div style="display: flex; gap: 15px;">
                <label for="fileInput" class="btn icon-upload">上傳圖片</label>
                <input type="file" id="fileInput" accept="image/*">
                <button id="resetBtn" class="btn icon-reset">重置展示</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * System Configuration
         * Balanced for high performance on mobile and clarity.
         */
        const config = {
            tileSize: 12,    // Size of each grid cell (smaller = more detail, slower)
            spacing: 0,      // 0 = Seamless image (Crucial for readability)
            friction: 0.92,  // How fast particles slow down
            ease: 0.15,      // How fast they return to origin
            mouseRadius: 20000, // Interaction strength (squared)
            scatterForce: 40 // How far they fly
        };

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loader = document.getElementById('loader');
        
        let width, height;
        let particles = [];
        let ambientParticles = [];
        let imageObj = null;
        
        // Mouse State
        let mouse = { x: undefined, y: undefined, isActive: false };

        // Handle Resize
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (imageObj) initParticles(imageObj);
        }
        window.addEventListener('resize', resizeCanvas);

        // Interaction Listeners
        window.addEventListener('mousemove', e => {
            mouse.x = e.x;
            mouse.y = e.y;
            mouse.isActive = true;
        });
        
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.isActive = true;
        }, { passive: false });

        window.addEventListener('touchend', () => { mouse.isActive = false; mouse.x = undefined; });
        window.addEventListener('mouseout', () => { mouse.isActive = false; mouse.x = undefined; });

        /**
         * PARTICLE CLASS
         * Represents a square slice of the image.
         */
        class Tile {
            constructor(x, y, color, size) {
                this.originX = x;
                this.originY = y;
                this.x = x; // Current position
                this.y = y;
                this.color = color;
                
                // Slightly overlap to prevent black lines (The "Gapless" trick)
                this.w = size + 0.6; 
                this.h = size + 0.6;
                
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.va = 0; // Velocity angle
            }

            update() {
                // Physics to return to origin
                const dx = this.originX - this.x;
                const dy = this.originY - this.y;
                
                // Move towards origin
                this.vx += dx * config.ease;
                this.vy += dy * config.ease;
                
                // Mouse Interaction
                if (mouse.isActive && mouse.x !== undefined) {
                    const dxMouse = mouse.x - this.x;
                    const dyMouse = mouse.y - this.y;
                    const distSq = dxMouse * dxMouse + dyMouse * dyMouse;

                    if (distSq < config.mouseRadius) {
                        const dist = Math.sqrt(distSq);
                        const force = (Math.sqrt(config.mouseRadius) - dist) / Math.sqrt(config.mouseRadius);
                        const angle = Math.atan2(dyMouse, dxMouse);
                        
                        // Push away
                        const pushX = Math.cos(angle) * force * config.scatterForce;
                        const pushY = Math.sin(angle) * force * config.scatterForce;
                        
                        this.vx -= pushX;
                        this.vy -= pushY;
                        
                        // Add some rotation for the "broken glass" effect
                        this.va += (Math.random() - 0.5) * 0.2 * force;
                    }
                }

                // Friction (dampening)
                this.vx *= config.friction;
                this.vy *= config.friction;
                this.va *= 0.9;

                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.va;
                
                // Reset angle slowly
                this.angle *= 0.9;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                // Draw rectangle centered at position
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                ctx.restore();
            }
        }

        /**
         * AMBIENT PARTICLE (The "Atmosphere")
         * These float ON TOP of the image to give the art feel,
         * without being part of the text readability.
         */
        class Floater {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Start anywhere vertically
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.speed = Math.random() * 1 + 0.5;
                this.size = Math.random() * 2;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.y -= this.speed;
                if(this.y < -10) this.reset();
            }

            draw() {
                ctx.fillStyle = `rgba(200, 255, 230, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        /**
         * INITIALIZATION
         * Reads image data and creates tiles.
         */
        function initParticles(img) {
            loader.style.display = 'block';
            
            // Wait a frame to allow UI to update
            setTimeout(() => {
                particles = [];
                ambientParticles = [];
                
                // 1. Calculate proper scaling to fit screen 'contain' style
                const scale = Math.min(width / img.width, height / img.height) * 0.85; // 0.85 for some padding
                const drawW = img.width * scale;
                const drawH = img.height * scale;
                const startX = (width - drawW) / 2;
                const startY = (height - drawH) / 2;

                // 2. Draw to offscreen canvas to get pixel data
                const tmpCanvas = document.createElement('canvas');
                const tmpCtx = tmpCanvas.getContext('2d');
                tmpCanvas.width = width;
                tmpCanvas.height = height;
                tmpCtx.drawImage(img, startX, startY, drawW, drawH);
                
                // 3. Scan pixels
                const step = config.tileSize;
                const imgData = tmpCtx.getImageData(0, 0, width, height).data;

                for (let y = startY; y < startY + drawH; y += step) {
                    for (let x = startX; x < startX + drawW; x += step) {
                        // Sample the center pixel of the grid cell
                        const index = ((Math.floor(y) * width) + Math.floor(x)) * 4;
                        const r = imgData[index];
                        const g = imgData[index + 1];
                        const b = imgData[index + 2];
                        const a = imgData[index + 3];

                        if (a > 128) { // Skip transparent
                            const color = `rgb(${r},${g},${b})`;
                            particles.push(new Tile(x, y, color, step));
                        }
                    }
                }

                // 4. Create atmospheric particles
                for(let i=0; i<80; i++) {
                    ambientParticles.push(new Floater());
                }

                loader.style.display = 'none';
            }, 50);
        }

        /**
         * ANIMATION LOOP
         */
        function animate() {
            // Clear with dark blue background (Matches the poster vibe)
            ctx.fillStyle = '#02111b'; 
            ctx.fillRect(0, 0, width, height);
            
            // 1. Draw Image Tiles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 2. Draw Floating Atmosphere (Top Layer)
            ambientParticles.forEach(ap => {
                ap.update();
                ap.draw();
            });

            requestAnimationFrame(animate);
        }

        /**
         * UI & FILE HANDLING
         */
        
        // 1. Create a default "Demo" visual
        function createDemoVisual() {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 600;
            tempCanvas.height = 800;
            
            // Background
            const grd = tCtx.createLinearGradient(0,0,0,800);
            grd.addColorStop(0, '#001');
            grd.addColorStop(1, '#023');
            tCtx.fillStyle = grd;
            tCtx.fillRect(0,0,600,800);
            
            // Text
            tCtx.fillStyle = 'white';
            tCtx.textAlign = 'center';
            tCtx.font = 'bold 60px serif';
            tCtx.fillText("ALTRÓVE", 300, 350);
            tCtx.font = '20px sans-serif';
            tCtx.fillStyle = '#80cbc4';
            tCtx.fillText("WU KUAN TE SOLO EXHIBITION", 300, 400);
            tCtx.fillStyle = '#aaa';
            tCtx.font = '16px sans-serif';
            tCtx.fillText("Please Upload DM Image", 300, 500);

            const img = new Image();
            img.src = tempCanvas.toDataURL();
            img.onload = () => {
                imageObj = img;
                resizeCanvas();
            }
        }

        // 2. File Upload
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imageObj = img;
                    resizeCanvas(); // Re-init with new image
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
             // Explode effect on reset
             particles.forEach(p => {
                 p.vx = (Math.random() - 0.5) * 50;
                 p.vy = (Math.random() - 0.5) * 50;
             });
        });

        // Start
        resizeCanvas();
        createDemoVisual();
        animate();

    </script>
</body>
</html>
