
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Altróve - Immersive Exhibition Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000508;
            overflow: hidden; /* 禁止捲動 */
            font-family: 'Montserrat', sans-serif;
            touch-action: none; /* 禁止手機雙指縮放 */
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* 畫布在最底層 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UI Controls - 使用 Fixed 確保在任何裝置都在視窗內 */
        .controls {
            position: fixed; 
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 30, 0.85);
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            gap: 20px;
            backdrop-filter: blur(10px);
            z-index: 999; /* 確保介面在最上層 */
            border: 1px solid rgba(128, 203, 196, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
            transition: opacity 0.3s;
        }
        
        /* 閒置時半透明，避免干擾畫面（可選） */
        body:not(:hover) .controls {
            opacity: 0.8;
        }
        .controls:hover {
            opacity: 1 !important;
        }

        .btn {
            background: transparent;
            color: #80cbc4;
            border: 1px solid #80cbc4;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            outline: none;
            user-select: none;
        }
        
        .btn:hover {
            background: rgba(128, 203, 196, 0.2);
            box-shadow: 0 0 15px rgba(128, 203, 196, 0.4);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        input[type="file"] { display: none; }
        
        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #80cbc4;
            display: none;
            letter-spacing: 2px;
            z-index: 1000;
            text-align: center;
            font-size: 1rem;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Info Panel Button */
        #info-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(128, 203, 196, 0.5);
            background: rgba(0, 20, 30, 0.7);
            color: #80cbc4;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        #info-toggle:hover {
            background: #80cbc4;
            color: #000508;
            transform: rotate(90deg);
        }

        /* Info Panel */
        #info-panel {
            position: fixed;
            top: 0; right: 0;
            width: 100%; max-width: 360px;
            height: 100%;
            background: rgba(2, 17, 27, 0.96);
            backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 998; /* 略低於按鈕 */
            padding: 90px 40px 40px 40px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid rgba(128, 203, 196, 0.1);
            color: #e0f7fa;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
        }

        #info-panel.active { transform: translateX(0); }

        .info-title h1 { font-size: 2rem; margin: 0 0 0.5rem 0; color: #fff; font-weight: 200; letter-spacing: 1px; }
        .info-title h2 { font-size: 0.95rem; margin: 0 0 2.5rem 0; color: #80cbc4; font-weight: 400; letter-spacing: 0.5px; }
        .info-section { margin-bottom: 2rem; }
        .info-label { font-size: 0.75rem; color: #5a8f89; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.5rem; display: block;}
        .info-text { font-size: 1rem; line-height: 1.6; color: #b2dfdb; font-weight: 300; }
        .highlight { color: #fff; font-weight: 500; border-bottom: 1px solid rgba(128, 203, 196, 0.3); padding-bottom: 2px; }

        /* Icons */
        .icon-upload::before { content: '↑'; font-family: monospace; font-weight: bold;}
        .icon-sound::before { content: '♪'; font-family: monospace;}

        /* Mobile Specific Adjustments */
        @media (max-width: 768px) {
            .controls { 
                bottom: 30px; 
                width: 85%; 
                justify-content: center; 
                padding: 10px;
                gap: 10px;
            }
            .btn { 
                padding: 8px 15px; 
                font-size: 0.85rem; 
                flex: 1; 
                justify-content: center;
            }
            #info-toggle { top: 20px; right: 20px; }
            .info-title h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="loading">讀取中...</div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 右上角資訊按鈕 -->
    <button id="info-toggle" title="展覽資訊">i</button>

    <!-- 滑出式資訊面板 -->
    <div id="info-panel">
        <div class="info-title">
            <h1>Altróve</h1>
            <h2>Wu Kuan Te Solo Exhibition</h2>
            <h2>《他方》吳冠德創作個展</h2>
        </div>
        <div class="info-section">
            <span class="info-label">展覽日期 | Date</span>
            <div class="info-text highlight">2025.12.05 — 2026.01.16</div>
        </div>
        <div class="info-section">
            <span class="info-label">開幕酒會 | Vernissage</span>
            <div class="info-text">2025.12.05 (Fri.) 19:00</div>
        </div>
        <div class="info-section">
            <span class="info-label">展覽地點 | Venue</span>
            <div class="info-text">
                <span class="highlight">Design Sulmondo Gallery</span><br>
                Via Chiatamone 26, Napoli
            </div>
        </div>
        <div class="info-section" style="margin-top: 40px; opacity: 0.5; font-size: 0.8rem;">
            點擊任意處關閉資訊
        </div>
    </div>

    <!-- 底部控制列 -->
    <div class="controls">
        <label for="upload" class="btn icon-upload">更換 DM</label>
        <input type="file" id="upload" accept="image/*">
        <button id="sound-toggle" class="btn icon-sound">音效: 開</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // 關閉透明度以提升效能
        const loading = document.getElementById('loading');
        const infoToggle = document.getElementById('info-toggle');
        const infoPanel = document.getElementById('info-panel');
        const soundToggleBtn = document.getElementById('sound-toggle');

        let particles = [];
        let imgObj = null;
        let mouse = { x: null, y: null };
        let isMobile = window.innerWidth < 768;

        // --- 音效系統 ---
        let audioCtx = null;
        let isSoundEnabled = true;
        let lastSoundTime = 0;
        const soundCooldown = 80; // 毫秒 (避免聲音太密集)

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound() {
            if (!isSoundEnabled || !audioCtx) return;
            const now = Date.now();
            if (now - lastSoundTime < soundCooldown) return;
            
            // 合成一個清脆的水滴/氣泡聲
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            // 頻率隨機變化增加自然感
            osc.frequency.setValueAtTime(300 + Math.random()*200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // 音量小一點
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
            lastSoundTime = now;
        }

        soundToggleBtn.addEventListener('click', (e) => {
            initAudio();
            isSoundEnabled = !isSoundEnabled;
            soundToggleBtn.textContent = isSoundEnabled ? "音效: 開" : "音效: 關";
            soundToggleBtn.style.opacity = isSoundEnabled ? '1' : '0.6';
            e.stopPropagation();
        });

        canvas.addEventListener('click', initAudio);
        canvas.addEventListener('touchstart', initAudio, {passive: true});

        // --- 資訊面板邏輯 ---
        infoToggle.addEventListener('click', () => infoPanel.classList.toggle('active'));
        
        // 點擊面板外或面板本身關閉
        infoPanel.addEventListener('click', (e) => {
            // 如果點選的不是文字選取區，則關閉
            const selection = window.getSelection();
            if(selection.toString().length === 0) {
                 infoPanel.classList.remove('active');
            }
        });

        // --- 粒子與畫面邏輯 ---
        
        // 設定參數
        const cols = isMobile ? 12 : 24; // 電腦版增加細緻度
        const pushStrength = isMobile ? 20 : 30;
        const returnSpeed = 0.15;

        class Tile {
            constructor(x, y, size, sX, sY, sW, sH) {
                this.baseX = x; this.baseY = y;
                this.x = x; this.y = y;
                this.size = size;
                this.sX = sX; this.sY = sY; this.sW = sW; this.sH = sH;
            }
            draw() {
                // size + 0.5 防止縫隙
                ctx.drawImage(imgObj, this.sX, this.sY, this.sW, this.sH, this.x, this.y, this.size + 0.5, this.size + 0.5);
            }
            update() {
                let dx = 0, dy = 0;
                // 互動邏輯
                if (mouse.x !== null) {
                    let mx = mouse.x - (this.x + this.size/2);
                    let my = mouse.y - (this.y + this.size/2);
                    let dSq = mx*mx + my*my;
                    let radSq = isMobile ? 8000 : 15000;
                    
                    if (dSq < radSq) {
                        let dist = Math.sqrt(dSq);
                        let force = (Math.sqrt(radSq) - dist) / Math.sqrt(radSq);
                        let ang = Math.atan2(my, mx);
                        dx -= Math.cos(ang) * force * pushStrength;
                        dy -= Math.sin(ang) * force * pushStrength;
                    }
                }
                // 彈性回歸
                dx += (this.baseX - this.x) * returnSpeed;
                dy += (this.baseY - this.y) * returnSpeed;
                this.x += dx;
                this.y += dy;
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            isMobile = canvas.width < 768;
            if(imgObj) initParticles();
        }
        
        window.addEventListener('resize', resize);

        // 輸入事件監聽
        const setMouse = (x, y) => {
            mouse.x = x; mouse.y = y;
            playSound();
        };
        
        canvas.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            setMouse(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        
        ['mouseleave', 'touchend', 'touchcancel'].forEach(ev => {
            canvas.addEventListener(ev, () => { mouse.x = null; mouse.y = null; });
        });

        function initParticles() {
            if(!imgObj) return;
            particles = [];
            
            // 安全邊距：手機留白多一點避免切邊
            const margin = isMobile ? 0.80 : 0.90;
            
            // 強制縮放 (Contain 模式)
            const scale = Math.min(
                (canvas.width * margin) / imgObj.width, 
                (canvas.height * margin) / imgObj.height
            );

            const drawW = imgObj.width * scale;
            const drawH = imgObj.height * scale;
            
            const startX = (canvas.width - drawW) / 2;
            const startY = (canvas.height - drawH) / 2;

            // 根據裝置決定切割細度
            const currentCols = isMobile ? 12 : 24;
            const tileSize = drawW / currentCols;
            const rows = Math.ceil(drawH / tileSize);

            for(let r=0; r<rows; r++) {
                for(let c=0; c<currentCols; c++) {
                    const sX = c * (imgObj.width / currentCols);
                    const sY = r * (imgObj.width / currentCols);
                    const sW = imgObj.width / currentCols;
                    const sH = sW;
                    
                    if(sY + sH/2 < imgObj.height) {
                        particles.push(new Tile(
                            startX + c*tileSize,
                            startY + r*tileSize,
                            tileSize,
                            sX, sY, sW, sH
                        ));
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = '#000508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // 載入圖片邏輯
        function loadDefault() {
            loading.style.display = 'block';
            const img = new Image();
            // 這裡設定為相對路徑，請確保 poster.jpg 在同層目錄
            img.src = "./poster.jpg";
            img.onload = () => {
                loading.style.display = 'none';
                imgObj = img;
                resize();
                animate();
            };
            img.onerror = () => {
                loading.style.display = 'block';
                loading.innerHTML = "未偵測到預設圖片<br><span style='font-size:0.8em; opacity:0.7'>(請確認 poster.jpg 位於同目錄)</span><br><br>請點擊下方按鈕手動上傳";
            };
        }

        document.getElementById('upload').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if(!f) return;
            loading.style.display = 'block';
            loading.innerHTML = "處理中...";
            const r = new FileReader();
            r.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    loading.style.display = 'none';
                    imgObj = img;
                    initParticles();
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(f);
        });

        // 啟動
        loadDefault();

    </script>
</body>
</html>
