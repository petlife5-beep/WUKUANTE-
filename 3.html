<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altróve - Particle Interaction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #canvas1 {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            background: rgba(0, 20, 30, 0.6);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background: transparent;
            color: #80cbc4;
            border: 1px solid #80cbc4;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #80cbc4;
            color: #000;
            box-shadow: 0 0 15px rgba(128, 203, 196, 0.5);
        }

        input[type="file"] {
            display: none;
        }

        .instruction {
            color: white;
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 5px;
            text-align: center;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #80cbc4;
            font-size: 1.2rem;
            pointer-events: none;
            display: none;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <canvas id="canvas1"></canvas>
    
    <div id="loading">GENERATING PARTICLES...</div>

    <div class="controls">
        <div class="instruction">建議：上傳您的 DM 圖片以獲得最佳效果</div>
        <div style="display: flex; gap: 10px;">
            <label for="imageUpload" class="btn">上傳 DM 圖片</label>
            <input type="file" id="imageUpload" accept="image/*">
            <button class="btn" id="resetBtn">重置畫面</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        let imageCoordinates = [];
        
        // Settings
        const particleDensity = 4; // Higher number = fewer particles (skip pixels)
        const mouseRadius = 100; // Interaction radius
        const returnSpeed = 0.08; // How fast particles fly back

        // Mouse/Touch handling
        let mouse = {
            x: null,
            y: null,
            radius: mouseRadius
        }

        window.addEventListener('mousemove', function(e){
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('touchmove', function(e){
            e.preventDefault(); 
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('mouseout', function(){
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchend', function(){
            mouse.x = null;
            mouse.y = null;
        });

        // Particle Class
        class Particle {
            constructor(x, y, color) {
                this.x = Math.random() * canvas.width; // Start random
                this.y = Math.random() * canvas.height;
                this.originX = x; // Target position (image pixel)
                this.originY = y;
                this.color = color;
                this.size = 1.5;
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.9; // Physics friction
                this.ease = Math.random() * 0.1 + returnSpeed; // Different return speeds for depth
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }

            update() {
                // Physics: Distance from target
                let dx = this.originX - this.x;
                let dy = this.originY - this.y;
                let distanceFromOrigin = Math.sqrt(dx*dx + dy*dy);
                
                // Physics: Distance from mouse
                let mouseDistance = 10000; // default infinity
                let force = 0;
                let angle = 0;

                if (mouse.x != null) {
                    let dxMouse = mouse.x - this.x;
                    let dyMouse = mouse.y - this.y;
                    mouseDistance = dxMouse*dxMouse + dyMouse*dyMouse; // squared distance for perf
                    
                    if (mouseDistance < mouse.radius * mouse.radius) {
                        const dist = Math.sqrt(mouseDistance);
                        force = (mouse.radius - dist) / mouse.radius;
                        angle = Math.atan2(dyMouse, dxMouse);
                        
                        // Push away from mouse
                        let pushX = Math.cos(angle) * force * 50; // Strength
                        let pushY = Math.sin(angle) * force * 50;
                        
                        this.vx -= pushX;
                        this.vy -= pushY;
                    }
                }

                // Move towards origin if not disturbed
                this.vx += dx * this.ease * 0.05;
                this.vy += dy * this.ease * 0.05;

                // Apply friction
                this.vx *= this.friction;
                this.vy *= this.friction;

                // Update pos
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        // Initialize particles from image data
        function init(img) {
            particlesArray = [];
            
            // Calculate aspect ratio to fit image in canvas
            let imgWidth = img.width;
            let imgHeight = img.height;
            const maxWidth = canvas.width * 0.9;
            const maxHeight = canvas.height * 0.8;
            
            // Maintain aspect ratio
            const scale = Math.min(maxWidth / imgWidth, maxHeight / imgHeight);
            const drawWidth = imgWidth * scale;
            const drawHeight = imgHeight * scale;
            const startX = (canvas.width - drawWidth) / 2;
            const startY = (canvas.height - drawHeight) / 2;

            // Draw image to an offscreen/temp context to read data
            ctx.drawImage(img, startX, startY, drawWidth, drawHeight);
            
            // Get pixel data
            // Optimization: Depending on device pixel ratio, this can be heavy.
            // We scan every 'particleDensity' pixel.
            const scannedData = ctx.getImageData(startX, startY, drawWidth, drawHeight);
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the image

            for (let y = 0; y < scannedData.height; y += particleDensity) {
                for (let x = 0; x < scannedData.width; x += particleDensity) {
                    const index = (y * scannedData.width + x) * 4;
                    const alpha = scannedData.data[index + 3];
                    
                    // Only create particles for visible pixels
                    if (alpha > 128) {
                        const r = scannedData.data[index];
                        const g = scannedData.data[index + 1];
                        const b = scannedData.data[index + 2];
                        const color = `rgb(${r},${g},${b})`;
                        
                        particlesArray.push(new Particle(x + startX, y + startY, color));
                    }
                }
            }
            loading.style.display = 'none';
        }

        // Animation Loop
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Trails effect (optional, change to 1 for no trails)
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
                particlesArray[i].update();
            }
            requestAnimationFrame(animate);
        }

        // --- Image Loading Logic ---

        // 1. Create a default "Placeholder" image programmatically so the screen isn't black
        function createDefaultImage() {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 600;
            tempCanvas.height = 800;

            // Background Gradient (Deep Ocean)
            const grd = tCtx.createLinearGradient(0, 0, 0, 800);
            grd.addColorStop(0, "#02111b");
            grd.addColorStop(0.5, "#004d40");
            grd.addColorStop(1, "#02111b");
            tCtx.fillStyle = grd;
            tCtx.fillRect(0, 0, 600, 800);

            // Ring
            tCtx.beginPath();
            tCtx.strokeStyle = "rgba(128, 203, 196, 0.8)";
            tCtx.lineWidth = 2;
            tCtx.arc(300, 400, 150, 0, Math.PI*2);
            tCtx.stroke();

            // Text
            tCtx.fillStyle = "#ffffff";
            tCtx.font = "300 60px serif";
            tCtx.textAlign = "center";
            tCtx.fillText("Altróve", 300, 380);
            
            tCtx.font = "300 20px sans-serif";
            tCtx.fillStyle = "#80cbc4";
            tCtx.letterSpacing = "5px";
            tCtx.fillText("WU KUAN TE", 300, 300);

            tCtx.font = "300 16px sans-serif";
            tCtx.fillStyle = "#b2dfdb";
            tCtx.fillText("Upload your DM Image", 300, 450);
            tCtx.fillText("to see the full effect", 300, 475);

            const img = new Image();
            img.src = tempCanvas.toDataURL();
            img.onload = () => init(img);
        }

        // 2. Handle User Upload
        const fileInput = document.getElementById('imageUpload');
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    init(img);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        const resetBtn = document.getElementById('resetBtn');
        resetBtn.addEventListener('click', () => {
             particlesArray.forEach(p => {
                 p.x = Math.random() * canvas.width;
                 p.y = Math.random() * canvas.height;
             });
        });

        // Start
        createDefaultImage();
        animate();

        // Handle resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Note: In a real prod app, we'd need to re-init particles here, 
            // but for this demo we'll let them float to avoid clearing user's upload immediately
        });

    </script>
</body>
</html>
