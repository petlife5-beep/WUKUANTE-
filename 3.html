
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Altróve - Immersive Exhibition Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%; /* 使用 100% 而非 100vh 以避免移動端導覽列跳動問題 */
            background-color: #000508;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            touch-action: none; /* 禁止預設的雙指縮放與滾動 */
            position: fixed; /* 強制固定視窗，防止 iOS 彈性滾動 */
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UI Controls */
        .controls {
            position: absolute;
            bottom: 30px; /* 提高底部距離，避開手機手勢條 */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 30, 0.85);
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            gap: 15px;
            backdrop-filter: blur(8px);
            z-index: 100;
            border: 1px solid rgba(128, 203, 196, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .btn {
            background: transparent;
            color: #80cbc4;
            border: 1px solid #80cbc4;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover {
            background: rgba(128, 203, 196, 0.15);
        }

        input[type="file"] { display: none; }
        
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #80cbc4;
            display: none;
            letter-spacing: 2px;
            z-index: 200;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
            pointer-events: none;
        }

        /* Info Panel Button */
        #info-toggle {
            position: absolute;
            top: 20px; /* 避開狀態列 */
            right: 20px;
            z-index: 110;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(128, 203, 196, 0.5);
            background: rgba(0, 20, 30, 0.7);
            color: #80cbc4;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            top: 0; right: 0;
            width: 100%; max-width: 320px;
            height: 100%;
            background: rgba(2, 17, 27, 0.95);
            backdrop-filter: blur(15px);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 105;
            padding: 80px 30px 30px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid rgba(128, 203, 196, 0.1);
            color: #e0f7fa;
        }

        #info-panel.active { transform: translateX(0); }

        .info-title h1 { font-size: 1.8rem; margin: 0 0 0.5rem 0; color: #fff; }
        .info-title h2 { font-size: 0.9rem; margin: 0 0 2rem 0; color: #80cbc4; }
        .info-section { margin-bottom: 1.5rem; }
        .info-label { font-size: 0.75rem; color: #80cbc4; opacity: 0.8; display: block; margin-bottom: 0.3rem;}
        .info-text { font-size: 0.9rem; line-height: 1.5; color: #b2dfdb; }
        .highlight { color: #fff; font-weight: 500; }

        /* Icons */
        .icon-upload::before { content: '↑'; }
        .icon-sound::before { content: '♪'; }

        @media (max-width: 480px) {
            .controls { padding: 10px 15px; gap: 10px; bottom: 40px;}
            .btn { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="loading">LOADING...</div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <button id="info-toggle">i</button>

    <div id="info-panel">
        <div class="info-title">
            <h1>Altróve</h1>
            <h2>Wu Kuan Te Solo Exhibition</h2>
            <h2>《他方》吳冠德創作個展</h2>
        </div>
        <div class="info-section">
            <span class="info-label">展覽日期 | Date</span>
            <div class="info-text highlight">2025.12.05 — 2026.01.16</div>
        </div>
        <div class="info-section">
            <span class="info-label">開幕酒會 | Vernissage</span>
            <div class="info-text">2025.12.05 (Fri.) 19:00</div>
        </div>
        <div class="info-section">
            <span class="info-label">展覽地點 | Venue</span>
            <div class="info-text">
                <span class="highlight">Design Sulmondo Gallery</span><br>
                Via Chiatamone 26, Napoli
            </div>
        </div>
    </div>

    <div class="controls">
        <label for="upload" class="btn icon-upload">更換 DM</label>
        <input type="file" id="upload" accept="image/*">
        <button id="sound-toggle" class="btn icon-sound">音效: 開</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const loading = document.getElementById('loading');
        const infoToggle = document.getElementById('info-toggle');
        const infoPanel = document.getElementById('info-panel');
        const soundToggleBtn = document.getElementById('sound-toggle');

        let particles = [];
        let imgObj = null;
        let mouse = { x: null, y: null };
        let isMobile = window.innerWidth < 768;

        // Sound System
        let audioCtx = null;
        let isSoundEnabled = true;
        let lastSoundTime = 0;
        const soundCooldown = 80;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound() {
            if (!isSoundEnabled || !audioCtx) return;
            const now = Date.now();
            if (now - lastSoundTime < soundCooldown) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 + Math.random()*200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
            lastSoundTime = now;
        }

        soundToggleBtn.addEventListener('click', (e) => {
            initAudio();
            isSoundEnabled = !isSoundEnabled;
            soundToggleBtn.textContent = isSoundEnabled ? "音效: 開" : "音效: 關";
            soundToggleBtn.style.opacity = isSoundEnabled ? '1' : '0.6';
            e.stopPropagation();
        });

        canvas.addEventListener('click', initAudio);
        canvas.addEventListener('touchstart', initAudio, {passive: true});

        // Info Panel
        infoToggle.addEventListener('click', () => infoPanel.classList.toggle('active'));
        infoPanel.addEventListener('click', (e) => {
            if(e.target === infoPanel) infoPanel.classList.remove('active');
        });

        // --- Improved Particle System ---
        
        // Config
        const cols = isMobile ? 12 : 20; // 減少欄數以增加粒子尺寸，提高效能
        const pushStrength = isMobile ? 20 : 30;
        const returnSpeed = 0.15;

        class Tile {
            constructor(x, y, size, sX, sY, sW, sH) {
                this.baseX = x; this.baseY = y;
                this.x = x; this.y = y;
                this.size = size;
                this.sX = sX; this.sY = sY; this.sW = sW; this.sH = sH;
            }
            draw() {
                // 使用 drawImage 確保高畫質，size+0.5 是為了消除縫隙
                ctx.drawImage(imgObj, this.sX, this.sY, this.sW, this.sH, this.x, this.y, this.size + 0.5, this.size + 0.5);
            }
            update() {
                let dx = 0, dy = 0;
                // 簡單的滑鼠互動邏輯
                if (mouse.x !== null) {
                    let mx = mouse.x - (this.x + this.size/2);
                    let my = mouse.y - (this.y + this.size/2);
                    let dSq = mx*mx + my*my;
                    // 增加互動半徑
                    let radSq = isMobile ? 8000 : 15000;
                    
                    if (dSq < radSq) {
                        let dist = Math.sqrt(dSq);
                        let force = (Math.sqrt(radSq) - dist) / Math.sqrt(radSq);
                        let ang = Math.atan2(my, mx);
                        dx -= Math.cos(ang) * force * pushStrength;
                        dy -= Math.sin(ang) * force * pushStrength;
                    }
                }
                // 回歸原位
                dx += (this.baseX - this.x) * returnSpeed;
                dy += (this.baseY - this.y) * returnSpeed;
                this.x += dx;
                this.y += dy;
            }
        }

        function resize() {
            // 使用 documentElement.clientWidth 獲得更精確的手機寬度
            canvas.width = document.documentElement.clientWidth || window.innerWidth;
            canvas.height = document.documentElement.clientHeight || window.innerHeight;
            isMobile = canvas.width < 768;
            if(imgObj) initParticles();
        }
        
        // 監聽螢幕旋轉與調整大小
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 100));

        // Input Listeners
        const setMouse = (x, y) => {
            mouse.x = x; mouse.y = y;
            playSound();
        };
        canvas.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            setMouse(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        
        ['mouseleave', 'touchend', 'touchcancel'].forEach(ev => {
            canvas.addEventListener(ev, () => { mouse.x = null; mouse.y = null; });
        });

        function initParticles() {
            if(!imgObj) return;
            particles = [];
            
            // *** 關鍵修正：手機版強制縮小比例 (Safe Padding) ***
            // 電腦版留 90% 畫面，手機版只留 80% 畫面，確保不會切邊
            const margin = isMobile ? 0.80 : 0.90;
            
            // 計算縮放比例：同時檢查寬度和高度，取最小值 (Contain)
            const scale = Math.min(
                (canvas.width * margin) / imgObj.width, 
                (canvas.height * margin) / imgObj.height
            );

            const drawW = imgObj.width * scale;
            const drawH = imgObj.height * scale;
            
            // 絕對置中
            const startX = (canvas.width - drawW) / 2;
            const startY = (canvas.height - drawH) / 2;

            const tileSize = drawW / cols;
            const rows = Math.ceil(drawH / tileSize);

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const sX = c * (imgObj.width / cols);
                    const sY = r * (imgObj.width / cols); // Source 是正方形切分
                    const sW = imgObj.width / cols;
                    const sH = sW;
                    
                    // 確保不超出圖片範圍
                    if(sY + sH/2 < imgObj.height) {
                        particles.push(new Tile(
                            startX + c*tileSize,
                            startY + r*tileSize,
                            tileSize,
                            sX, sY, sW, sH
                        ));
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = '#000508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Load Image
        function loadDefault() {
            loading.style.display = 'block';
            const img = new Image();
            // 讀取同層目錄的 poster.jpg
            img.src = "./poster.jpg";
            img.onload = () => {
                loading.style.display = 'none';
                imgObj = img;
                resize();
                animate();
            };
            img.onerror = () => {
                loading.style.display = 'block';
                loading.innerHTML = "未偵測到預設圖片<br>請點擊下方按鈕上傳";
            };
        }

        document.getElementById('upload').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if(!f) return;
            loading.style.display = 'block';
            const r = new FileReader();
            r.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    loading.style.display = 'none';
                    imgObj = img;
                    initParticles();
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(f);
        });

        // Start
        loadDefault();

    </script>
</body>
</html>
