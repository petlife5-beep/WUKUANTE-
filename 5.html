<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粉紅拍立得 (圖片版)</title>
    <style>
        /* --- 基礎設定 --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #f8e8e8; /* 配合粉紅相機改稍微粉嫩的背景 */
            background-image: 
                radial-gradient(#e6caca 1px, transparent 0px);
            background-size: 20px 20px;
            height: 100dvh;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative; 
        }

        /* --- 提示列 --- */
        .hint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.9rem;
            background: rgba(255, 150, 150, 0.9); /* 粉紅提示框 */
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #fff;
            pointer-events: none;
            white-space: nowrap;
            z-index: 2000;
            box-shadow: 0 4px 10px rgba(255, 100, 100, 0.2);
            transition: opacity 0.5s ease;
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        /* --- 相機容器 --- */
        .camera-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px; /* 配合圖片比例調整寬度 */
            height: 320px;
            z-index: 100;
            transform-origin: bottom center;
            pointer-events: none; 
        }
        
        .camera-container > * { pointer-events: auto; }

        /* RWD: 手機版縮放 */
        @media (max-width: 600px) {
            .camera-container {
                transform: translateX(-50%) scale(0.85);
                bottom: 10px;
            }
        }

        /* --- 相機圖片本體 --- */
        .camera-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            /* 這裡引入你的圖片 */
            background-image: url('camera.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            z-index: 20; /* 相機層級：在照片(15)之上，但在鏡頭(22)之下? 不，鏡頭要在最上層蓋住原本的黑圈 */
        }

        /* --- 視訊鏡頭 (調整位置以覆蓋圖片中的黑圈) --- */
        .lens-wrapper {
            position: absolute;
            /* 這些數值是根據你提供的圖片估算的 */
            width: 43%; 
            height: 43%;
            right: 11%; 
            bottom: 16%;
            
            background: #000; 
            border-radius: 50%; 
            overflow: hidden; 
            z-index: 22; /* 必須蓋在圖片上面 */
            /* 加一點內陰影讓鏡頭看起來更有深度 */
            box-shadow: inset 0 5px 20px rgba(0,0,0,0.8); 
        }

        video#camera-feed {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* 鏡像 */
        }

        /* --- 透明快門按鈕 (覆蓋在圖片左邊那個粉紅圓鈕上) --- */
        .shutter-trigger {
            position: absolute;
            left: 23%;
            top: 38%;
            width: 16%;
            height: 16%;
            background: rgba(255, 0, 0, 0); /* 完全透明 */
            border-radius: 50%;
            cursor: pointer;
            z-index: 30; /* 最上層，確保點得到 */
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        
        /* 按下去的視覺回饋 (選用) */
        .shutter-trigger:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- 出紙口定位 (設定在相機頂部) --- */
        .paper-slot {
            position: absolute; 
            top: 20px; /* 大約在圖片頂部 */
            left: 50%; 
            transform: translateX(-50%);
            width: 160px; 
            height: 10px; 
            /* background: red; 測試用，正式版隱藏 */
            z-index: 10; /* 在相機圖片後面 */
        }

        /* --- 拍立得相紙 --- */
        .polaroid {
            position: absolute;
            width: 160px;
            height: 230px;
            background: #fff;
            padding: 10px 10px 50px 10px;
            box-sizing: border-box;
            box-shadow: 2px 2px 15px rgba(0,0,0,0.2);
            cursor: grab;
            z-index: 15; /* 關鍵：必須小於 camera-body(20) 才能從後面出來 */
            touch-action: none;
            transition: top 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 5s ease;
        }

        .polaroid img {
            width: 100%; height: 170px; object-fit: cover;
            background-color: #000; border: 1px solid #eee;
            pointer-events: none; display: block;
        }

        /* --- 下載按鈕 --- */
        .download-btn {
            position: absolute; bottom: 5px; right: 5px;
            width: 48px; height: 48px;
            background: #333; color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            z-index: 200; cursor: pointer; opacity: 1 !important;
        }
        .download-btn svg {
            width: 24px; height: 24px; pointer-events: none;
            fill: none; stroke: #fff; stroke-width: 2.5;
        }
        .download-btn:active { transform: scale(0.9); background: #000; }

        /* 濾鏡效果 */
        .developing img { filter: blur(8px) grayscale(0.9) contrast(0.6) brightness(0.4); }
        .developed img { filter: blur(0) grayscale(0) contrast(1) brightness(1); }

    </style>
</head>
<body>

    <div class="hint" id="hint-text">點擊圓形按鈕拍攝 ｜ 拖曳照片佈置</div>

    <div class="camera-container">
        <div class="shutter-trigger" onclick="takePhoto()"></div>

        <div class="camera-body">
            <div class="lens-wrapper">
                <video id="camera-feed" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="paper-slot" id="paperSlot"></div>
    </div>

    <canvas id="capture-canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        const paperSlot = document.getElementById('paperSlot');
        const hintText = document.getElementById('hint-text');
        
        let currentTopZ = 200;
        let photoCount = 0;

        // --- 提示循環 ---
        function startHintCycle() {
            const messages = [
                "點擊圓鈕拍攝 ｜ 拖曳照片佈置 ｜ 點黑鈕下載",
                "⚠️ 提醒：關閉網頁後，照片將會消失"
            ];
            let index = 0;
            setInterval(() => {
                hintText.style.opacity = 0;
                setTimeout(() => {
                    index = (index + 1) % messages.length;
                    hintText.innerText = messages[index];
                    hintText.style.opacity = 1;
                }, 500);
            }, 4000);
        }
        startHintCycle();

        // --- 防呆保護 ---
        window.addEventListener('beforeunload', (e) => {
            if (photoCount > 0) {
                e.preventDefault();
                e.returnValue = '';
                return "照片尚未下載，確定要離開嗎？";
            }
        });

        // --- 初始化相機 ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error(err);
                alert("無法啟動相機，請確認權限或使用 HTTPS 連線。");
            }
        }
        initCamera();

        // --- 音效 ---
        function playShutterSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const actx = new AudioContext();
            const t = actx.currentTime;
            
            // 模擬可愛的電子快門聲
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(400, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.1);
            
            osc.connect(gain); gain.connect(actx.destination); osc.start(t);
        }

        // --- 拍照 ---
        function takePhoto() {
            playShutterSound();
            const vW = video.videoWidth; const vH = video.videoHeight;
            canvas.width = vW; canvas.height = vH;
            
            // 3:4 裁切
            const targetRatio = 3/4; const sourceRatio = vW / vH;
            let cropW, cropH, startX, startY;
            if (sourceRatio > targetRatio) {
                cropH = vH; cropW = vH * targetRatio; startX = (vW - cropW) / 2; startY = 0;
            } else {
                cropW = vW; cropH = vW / targetRatio; startX = 0; startY = (vH - cropH) / 2;
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropW; tempCanvas.height = cropH;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.translate(cropW, 0); tempCtx.scale(-1, 1);
            tempCtx.drawImage(video, startX, startY, cropW, cropH, 0, 0, cropW, cropH);
            
            createPolaroid(tempCanvas.toDataURL('image/png'));
        }

        // --- 產生照片 ---
        function createPolaroid(imgUrl) {
            photoCount++;
            const photoDiv = document.createElement('div');
            photoDiv.classList.add('polaroid', 'developing');
            
            const img = document.createElement('img');
            img.src = imgUrl;
            
            const downloadBtn = document.createElement('div');
            downloadBtn.classList.add('download-btn');
            downloadBtn.innerHTML = `<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>`;
            
            const triggerDownload = (e) => {
                e.stopPropagation(); e.preventDefault();
                downloadPolaroid(imgUrl);
            };
            downloadBtn.addEventListener('touchstart', triggerDownload, {passive: false});
            downloadBtn.addEventListener('mousedown', triggerDownload);

            photoDiv.appendChild(img);
            photoDiv.appendChild(downloadBtn);
            document.body.appendChild(photoDiv);

            // 定位：相機頂部的出紙口
            const slotRect = paperSlot.getBoundingClientRect();
            const photoWidth = 160;
            const startLeft = slotRect.left + (slotRect.width/2) - (photoWidth/2);
            const startTop = slotRect.top;

            // 初始位置 (藏在相機後面)
            photoDiv.style.left = startLeft + 'px';
            photoDiv.style.top = startTop + 'px';
            
            void photoDiv.offsetWidth; // 強制重繪

            // 彈出動畫：往上移動 220px
            const targetTop = startTop - 220;
            photoDiv.style.top = targetTop + 'px';

            setTimeout(() => {
                photoDiv.classList.remove('developing');
                photoDiv.classList.add('developed');
            }, 500);

            makeDraggable(photoDiv);
        }

        function downloadPolaroid(sourceUrl) {
            const dlCanvas = document.createElement('canvas');
            const dlCtx = dlCanvas.getContext('2d');
            const w = 600; const h = 800; const padding = 40; const bottom = 160;
            dlCanvas.width = w; dlCanvas.height = h;
            dlCtx.fillStyle = '#fff'; dlCtx.fillRect(0, 0, w, h);
            const image = new Image();
            image.onload = () => {
                dlCtx.fillStyle = '#111';
                dlCtx.fillRect(padding, padding, w - padding*2, h - padding - bottom);
                dlCtx.drawImage(image, padding+2, padding+2, w - padding*2 - 4, h - padding - bottom - 4);
                const link = document.createElement('a');
                link.download = 'polaroid_' + Date.now() + '.png';
                link.href = dlCanvas.toDataURL('image/png');
                link.click();
            };
            image.src = sourceUrl;
        }

        // --- 拖曳邏輯 ---
        function makeDraggable(el) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            const start = (e) => {
                if (e.target.closest('.download-btn')) return;
                isDragging = true;
                currentTopZ++;
                el.style.zIndex = currentTopZ; // 拖曳時置頂
                el.style.transition = 'none';

                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                startX = clientX; startY = clientY;

                const style = window.getComputedStyle(el);
                initialLeft = parseInt(style.left);
                initialTop = parseInt(style.top);
                
                if (isNaN(initialLeft)) initialLeft = el.getBoundingClientRect().left;
                if (isNaN(initialTop)) initialTop = el.getBoundingClientRect().top;

                el.style.transform = `scale(1.02) rotate(${Math.random() * 4 - 2}deg)`;
            };

            const move = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;
                el.style.left = (initialLeft + dx) + 'px';
                el.style.top = (initialTop + dy) + 'px';
            };

            const end = (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.style.transition = 'filter 5s ease';
                el.style.transform = `scale(1) rotate(${Math.random() * 6 - 3}deg)`;
            };

            el.addEventListener('mousedown', start);
            el.addEventListener('touchstart', start, {passive: false});
            document.addEventListener('mousemove', move);
            document.addEventListener('touchmove', move, {passive: false});
            document.addEventListener('mouseup', end);
            document.addEventListener('touchend', end);
        }
    </script>
</body>
</html>
