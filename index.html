<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altróve - Wu Kuan Te Solo Exhibition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@300;500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b1e2d;
            --text-gold: #e0d3b8;
            --text-white: #f5f5f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', 'Noto Serif TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
            /* 一開始禁止捲動，等動畫跑完 */
            overflow-y: hidden; 
        }

        /* ====================
           開場動畫層 (Intro Layer)
           這是讓畫家驚艷的關鍵
        ==================== */
        #intro-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #06121a; /* 深海黑 */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: finishIntro 1.5s ease-in-out 4s forwards; /* 4秒後淡出 */
            pointer-events: none; /* 動畫結束後不擋滑鼠 */
        }

        .flight-path {
            position: absolute;
            width: 100%;
            height: 200px;
            top: 40%;
            transform: translateY(-50%);
        }

        /* 鸚鵡 (使用 CSS 形狀模擬或 SVG) */
        .bird-shape {
            position: absolute;
            left: -10%;
            width: 40px;
            height: 40px;
            background: var(--text-gold);
            /* 簡單的鳥型剪影 (使用 clip-path) */
            clip-path: polygon(0% 50%, 30% 0%, 100% 40%, 70% 60%, 40% 100%, 20% 70%);
            box-shadow: 0 0 20px var(--text-gold);
            animation: flyAcross 3.5s cubic-bezier(0.45, 0, 0.55, 1) forwards;
        }

        .bird-trail {
            position: absolute;
            top: 50%;
            left: -10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(224, 211, 184, 0.8), transparent);
            width: 200px;
            animation: trailFollow 3.5s cubic-bezier(0.45, 0, 0.55, 1) forwards;
        }

        .intro-text {
            font-family: 'Cinzel', serif;
            color: var(--text-gold);
            font-size: 1.5rem;
            opacity: 0;
            position: absolute;
            text-align: center;
            letter-spacing: 0.2em;
        }

        .text-1 { top: 60%; animation: showText 1s ease-out 0.5s forwards, hideText 0.5s ease-in 1.8s forwards; }
        .text-2 { top: 60%; animation: showText 1s ease-out 2.2s forwards; }

        @keyframes flyAcross {
            0% { left: -10%; transform: scale(0.5) rotate(15deg); }
            50% { transform: scale(1) rotate(0deg); }
            100% { left: 110%; transform: scale(0.8) rotate(-10deg); }
        }

        @keyframes trailFollow {
            0% { left: -15%; opacity: 0; }
            10% { opacity: 1; }
            100% { left: 105%; opacity: 0; }
        }

        @keyframes showText { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes hideText { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }
        
        @keyframes finishIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* ====================
           主頁面 (原本的高質感內容)
        ==================== */
        .background-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -10;
            background: radial-gradient(circle at center, #1a4a5e 0%, #06121a 100%);
        }
        .texture-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('poster.jpg'); background-size: cover; background-position: center;
            opacity: 0.15; filter: blur(10px) saturate(1.2); z-index: -9;
        }
        .spotlight-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.1) 0%, transparent 40%);
            z-index: -8; pointer-events: none; transition: background 0.1s ease;
        }
        .circle-deco {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vw; height: 70vw; border: 1px solid rgba(224, 211, 184, 0.08);
            border-radius: 50%; z-index: -5; pointer-events: none;
            animation: rotateCircle 60s linear infinite;
        }

        /* 內容容器 - 延遲顯示，等開場跑完 */
        .container {
            max-width: 1200px; margin: 0 auto; padding: 40px 20px;
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; z-index: 1;
            opacity: 0;
            animation: pageFadeIn 2s ease-out 3.5s forwards; /* 3.5秒後才出現 */
        }

        @keyframes pageFadeIn { to { opacity: 1; } }

        header { text-align: center; margin-bottom: 60px; }
        h1 { font-family: 'Cinzel', serif; font-size: 4rem; letter-spacing: 0.15em; color: var(--text-white); text-shadow: 0 0 30px rgba(255,255,255,0.4); }
        h2 { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 0.3em; color: var(--text-gold); border-bottom: 1px solid rgba(224, 211, 184, 0.3); padding-bottom: 10px; display: inline-block; margin-bottom: 30px;}
        .chinese-title { font-family: 'Noto Serif TC', serif; font-size: 2rem; letter-spacing: 0.5em; margin-top: 10px; display: block; font-weight: 300; }
        .artist-name { font-size: 1.1rem; letter-spacing: 0.2em; margin-top: 15px; opacity: 0.8; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; width: 100%; align-items: center; }
        
        .poster-display {
            position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden;
            transition: transform 0.5s ease;
        }
        .poster-display:hover { transform: translateY(-15px) scale(1.02); }
        .poster-display img { width: 100%; height: auto; display: block; }

        .info-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 50px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .info-item { margin-bottom: 30px; border-left: 2px solid var(--text-gold); padding-left: 20px; }
        .info-label { font-family: 'Cinzel', serif; color: var(--text-gold); font-size: 0.9rem; letter-spacing: 0.1em; margin-bottom: 8px; display: block; }
        .info-text { font-size: 1.1rem; font-weight: 300; color: #fff; }
        .info-subtext { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-top: 5px; display: block; }

        .map-link { text-decoration: none; color: inherit; display: block; transition: all 0.3s ease; }
        .map-link:hover .info-text { color: var(--text-gold); text-shadow: 0 0 10px rgba(224, 211, 184, 0.6); }
        .map-pin-icon { display: inline-block; margin-left: 5px; font-style: normal; }

        footer { margin-top: auto; padding: 20px; text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.4); width: 100%; }

        @keyframes rotateCircle { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; gap: 40px; }
            h1 { font-size: 2.5rem; }
            .container { padding-top: 80px; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <!-- 開場動畫層 -->
    <div id="intro-layer">
        <div class="flight-path">
            <div class="bird-trail"></div>
            <div class="bird-shape"></div> <!-- 飛行的金色鸚鵡 -->
        </div>
        <div class="intro-text text-1">From Taiwan...</div>
        <div class="intro-text text-2">To Italy</div>
    </div>

    <!-- 主頁面 -->
    <div class="background-wrapper">
        <div class="texture-overlay"></div>
        <div class="spotlight-overlay"></div>
    </div>
    <div class="circle-deco"></div>

    <div class="container">
        <header>
            <h2>Wu Kuan Te Solo Exhibition</h2>
            <h1>Altróve</h1>
            <span class="chinese-title">《他方》</span>
            <p class="artist-name">吳冠德 創作個展</p>
        </header>

        <div class="content-grid">
            <div class="poster-display">
                <img src="poster.jpg" alt="Altróve Exhibition Poster">
            </div>

            <div class="info-card">
                <div class="info-item">
                    <span class="info-label">Date / 展覽日期</span>
                    <div class="info-text">2025.12.05 — 2026.01.16</div>
                    <span class="info-subtext">Tue - Sat | 11:00 - 19:00</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Vernissage / 開幕酒會</span>
                    <div class="info-text">2025.12.05 (Fri) 19:00</div>
                </div>

                <div class="info-item">
                    <span class="info-label">Location / 展覽地點</span>
                    <a href="https://www.google.com/maps/search/?api=1&query=Design+Sulmondo+Gallery+Via+Chiatamone+26+Napoli" target="_blank" class="map-link">
                        <div class="info-text">Design Sulmondo Gallery</div>
                        <span class="info-subtext">Via Chiatamone 26, Napoli <i class="map-pin-icon">📍</i></span>
                    </a>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2025 Wu Kuan Te. All Rights Reserved.
        </footer>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth * 100;
            const y = e.clientY / window.innerHeight * 100;
            document.documentElement.style.setProperty('--mouse-x', x + '%');
            document.documentElement.style.setProperty('--mouse-y', y + '%');
        });

        // 動畫結束後恢復捲動
        setTimeout(() => {
            document.body.style.overflowY = 'auto';
        }, 4500);
    </script>
</body>
</html>
