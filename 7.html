<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arix Signature Interactive Christmas Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000502; height: 100%; width: 100%; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .font-serif { font-family: 'Times New Roman', Times, serif; }
        .tracking-widest-custom { letter-spacing: 0.3em; }
        
        /* UI 動畫 */
        .fade-in { opacity: 0; animation: fadeIn 1.5s ease-out forwards 0.5s; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(-10px); } }

        /* 按鈕特效 */
        .btn-glow {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, transparent 50%, rgba(230, 190, 138, 0.1) 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
        }
        .btn-glow:hover { background-position: 100% 0%; border-color: rgba(255, 255, 255, 0.6); }
        .btn-active { background-color: rgba(230, 190, 138, 0.1); border-color: #E6BE8A; }
    </style>
    
    <!-- Import Map: 確保 Three.js 模組正確加載 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- UI 層 -->
    <div id="ui-layer" class="flex flex-col justify-between p-8 md:p-12 text-white select-none">
        <!-- 標題 -->
        <div class="flex flex-col items-center md:items-start space-y-2 fade-in transform translate-y-[-10px]">
            <h1 class="text-4xl md:text-6xl font-serif tracking-tighter text-[#E6BE8A] drop-shadow-[0_0_15px_rgba(230,190,138,0.5)]">
                ARIX
            </h1>
            <div class="h-[1px] w-24 bg-gradient-to-r from-[#E6BE8A] to-transparent"></div>
            <p class="text-xs md:text-sm font-light tracking-widest-custom uppercase text-emerald-100/60">
                Signature Collection
            </p>
        </div>

        <!-- 控制區 -->
        <div class="flex flex-col items-center space-y-6 pb-8 pointer-events-auto">
            <button id="toggle-btn" class="btn-glow group relative px-10 py-4 border border-white/20 overflow-hidden cursor-pointer">
                <div class="flex items-center space-x-3 relative z-10">
                    <svg id="icon-sparkle" class="w-4 h-4 text-[#E6BE8A]" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 18v4"/><path d="M15 20h4"/></svg>
                    <svg id="icon-move" class="w-4 h-4 text-[#E6BE8A] hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M19 3v18"/><path d="M5 12h14"/><path d="m5 9 3-3"/><path d="m5 15 3 3"/><path d="m19 9-3-3"/><path d="m19 15-3 3"/></svg>
                    
                    <span id="btn-text" class="font-sans font-bold tracking-[0.2em] text-sm text-white group-hover:text-[#E6BE8A] transition-colors">ASSEMBLE</span>
                </div>
            </button>
            <p id="status-text" class="text-[10px] text-emerald-100/30 tracking-widest font-light">
                STATUS: AWAITING INPUT
            </p>
        </div>
    </div>

    <!-- 3D 畫布 -->
    <div id="canvas-container"></div>

    <!-- 邏輯腳本 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- 配置 ---
        const PALETTE = {
            EMERALD_DARK: 0x001a10,
            EMERALD_LIGHT: new THREE.Color('#004225'),
            GOLD_METALLIC: new THREE.Color('#FFD700'),
            GOLD_ROSE: 0xE6BE8A,
        };

        const STATE = {
            active: false,
            mix: 0 // 0 = Scatter, 1 = Tree
        };

        // --- 初始化場景 ---
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PALETTE.EMERALD_DARK);
        
        // 環境貼圖
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 25);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 10;
        controls.maxDistance = 40;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.5;

        // --- 燈光 ---
        const ambientLight = new THREE.AmbientLight(PALETTE.EMERALD_DARK, 2.0);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(PALETTE.GOLD_ROSE, 100);
        spotLight.position.set(10, 20, 10);
        spotLight.angle = 0.25;
        spotLight.penumbra = 1;
        spotLight.castShadow = true;
        spotLight.shadow.bias = -0.0001;
        scene.add(spotLight);

        const fillLight = new THREE.SpotLight(0xffffff, 50);
        fillLight.position.set(-10, 5, 10);
        fillLight.angle = 0.5;
        scene.add(fillLight);

        // --- 輔助函數 ---
        function getConePoint(radius, height, yPos) {
            const r = (yPos / height) * radius;
            const theta = Math.random() * Math.PI * 2;
            const x = r * Math.cos(theta);
            const z = r * Math.sin(theta);
            return new THREE.Vector3(x, height - yPos - height / 2, z);
        }

        function getSpherePoint(radius) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = radius * Math.cbrt(Math.random());
            const sinPhi = Math.sin(phi);
            const x = r * sinPhi * Math.cos(theta);
            const y = r * sinPhi * Math.sin(theta);
            const z = r * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        // --- 1. 針葉系統 (ShaderMaterial) ---
        const foliageCount = 4000;
        const foliageGeometry = new THREE.BufferGeometry();
        
        const fPosTree = [];
        const fPosScatter = [];
        const fRandoms = [];
        const fSizes = [];

        for (let i = 0; i < foliageCount; i++) {
            // Tree
            const yNorm = Math.pow(Math.random(), 0.8);
            const height = 14;
            const yPos = yNorm * height;
            const radius = (yPos / height) * 5.5;
            const treeVec = getConePoint(radius, height, yPos);
            fPosTree.push(treeVec.x, treeVec.y, treeVec.z);

            // Scatter
            const scatterVec = getSpherePoint(18);
            fPosScatter.push(scatterVec.x, scatterVec.y, scatterVec.z);

            fRandoms.push(Math.random());
            fSizes.push(Math.random() * 2.0 + 0.5);
        }

        foliageGeometry.setAttribute('position', new THREE.Float32BufferAttribute(fPosTree, 3)); // 初始位置
        foliageGeometry.setAttribute('aPositionTree', new THREE.Float32BufferAttribute(fPosTree, 3));
        foliageGeometry.setAttribute('aPositionScatter', new THREE.Float32BufferAttribute(fPosScatter, 3));
        foliageGeometry.setAttribute('aRandom', new THREE.Float32BufferAttribute(fRandoms, 1));
        foliageGeometry.setAttribute('aSize', new THREE.Float32BufferAttribute(fSizes, 1));

        const foliageMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMix: { value: 0 },
                uColorBase: { value: PALETTE.EMERALD_LIGHT },
                uColorGlow: { value: PALETTE.GOLD_METALLIC },
                uPixelRatio: { value: renderer.getPixelRatio() }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uMix;
                uniform float uPixelRatio;
                
                attribute vec3 aPositionTree;
                attribute vec3 aPositionScatter;
                attribute float aSize;
                attribute float aRandom;
                
                varying float vAlpha;
                varying float vRandom;

                void main() {
                    vRandom = aRandom;
                    
                    // Cubic easing
                    float t = uMix;
                    float ease = t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;

                    vec3 pos = mix(aPositionScatter, aPositionTree, ease);

                    // Breathing effect
                    float breath = sin(uTime * 2.0 + aRandom * 10.0) * 0.1;
                    pos.y += breath * (1.0 - ease * 0.8);

                    // Twirl effect during transition
                    float rotAngle = (1.0 - ease) * aRandom * 5.0;
                    float c = cos(rotAngle);
                    float s = sin(rotAngle);
                    mat2 rot = mat2(c, -s, s, c);
                    pos.xz = rot * pos.xz;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    gl_PointSize = aSize * uPixelRatio * (200.0 / -mvPosition.z);
                    vAlpha = 0.6 + 0.4 * ease;
                }
            `,
            fragmentShader: `
                uniform vec3 uColorBase;
                uniform vec3 uColorGlow;
                varying float vAlpha;
                varying float vRandom;

                void main() {
                    vec2 center = gl_PointCoord - 0.5;
                    float dist = length(center);
                    if (dist > 0.5) discard;

                    float glow = smoothstep(0.0, 0.5, dist);
                    vec3 finalColor = mix(uColorBase, uColorGlow, glow * 0.8);
                    finalColor += vec3(0.3) * step(0.95, vRandom); // Sparkles

                    gl_FragColor = vec4(finalColor, vAlpha * (1.0 - dist * 1.5));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const foliage = new THREE.Points(foliageGeometry, foliageMaterial);
        foliage.position.y = -2;
        scene.add(foliage);

        // --- 2. 裝飾系統 (InstancedMesh) ---
        const ornamentCount = 200;
        const sphereGeo = new THREE.SphereGeometry(1, 16, 16);
        const sphereMat = new THREE.MeshStandardMaterial({
            color: PALETTE.GOLD_METALLIC,
            roughness: 0.1,
            metalness: 1.0,
            emissive: PALETTE.GOLD_ROSE,
            emissiveIntensity: 0.2
        });

        const ornaments = new THREE.InstancedMesh(sphereGeo, sphereMat, ornamentCount);
        ornaments.castShadow = true;
        ornaments.receiveShadow = true;
        ornaments.position.y = -2;
        
        const oData = [];
        const dummy = new THREE.Object3D();

        for (let i = 0; i < ornamentCount; i++) {
            const yNorm = Math.pow(Math.random(), 0.9);
            const height = 13;
            const yPos = yNorm * height;
            const radius = (yPos / height) * 5.0 + 0.5;
            const theta = yPos * 2.5 + (i % 5) * (Math.PI * 2 / 5);
            
            const treePos = new THREE.Vector3(
                radius * Math.cos(theta),
                height - yPos - height/2,
                radius * Math.sin(theta)
            );
            const scatterPos = getSpherePoint(20);

            oData.push({
                treePos,
                scatterPos,
                scale: Math.random() * 0.4 + 0.2,
                speed: Math.random() * 0.5 + 0.2
            });
        }
        scene.add(ornaments);

        // --- 3. 頂部星星 ---
        const starGeo = new THREE.OctahedronGeometry(1, 0);
        const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const starMesh = new THREE.Mesh(starGeo, starMat);
        const starGroup = new THREE.Group();
        starGroup.add(starMesh);
        
        // Star glow light
        const starLight = new THREE.PointLight(PALETTE.GOLD_METALLIC, 5, 10);
        starGroup.add(starLight);
        starGroup.position.set(0, 5.5, 0); // (7.5 - 2 offset)
        scene.add(starGroup);


        // --- 後期處理 (Bloom) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.7;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        // --- 動畫循環 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const delta = clock.getDelta();

            // 1. 狀態插值
            const targetMix = STATE.active ? 1.0 : 0.0;
            STATE.mix += (targetMix - STATE.mix) * 0.03; // Smooth Lerp

            // 2. 更新針葉
            foliageMaterial.uniforms.uTime.value = t;
            foliageMaterial.uniforms.uMix.value = STATE.mix;

            // 3. 更新裝飾
            for (let i = 0; i < ornamentCount; i++) {
                const d = oData[i];
                const pos = new THREE.Vector3().lerpVectors(d.scatterPos, d.treePos, STATE.mix);
                
                // 輕微晃動
                const wobble = STATE.active ? 0.1 : 2.0;
                pos.y += Math.sin(t * d.speed + i) * wobble * (1 - STATE.mix * 0.8);

                dummy.position.copy(pos);
                // 散開時變小
                dummy.scale.setScalar(d.scale * (0.5 + 0.5 * STATE.mix));
                dummy.rotation.set(t * d.speed, t * d.speed * 0.5, 0);
                
                dummy.updateMatrix();
                ornaments.setMatrixAt(i, dummy.matrix);
            }
            ornaments.instanceMatrix.needsUpdate = true;

            // 4. 更新星星
            starGroup.scale.setScalar(THREE.MathUtils.lerp(0.01, 1.5, STATE.mix));
            starGroup.rotation.y = t * 0.5;
            
            // 5. 更新相機控制
            controls.autoRotate = STATE.active;
            controls.update();

            // 渲染
            composer.render();
        }

        animate();

        // --- UI 交互事件 ---
        const btn = document.getElementById('toggle-btn');
        const btnText = document.getElementById('btn-text');
        const statusText = document.getElementById('status-text');
        const iconSparkle = document.getElementById('icon-sparkle');
        const iconMove = document.getElementById('icon-move');

        btn.addEventListener('click', () => {
            STATE.active = !STATE.active;
            
            // UI 更新
            if (STATE.active) {
                btn.classList.add('btn-active');
                btnText.innerText = "RELEASE";
                btnText.classList.remove('text-white');
                btnText.classList.add('text-[#E6BE8A]');
                statusText.innerText = "STATUS: CONVERGED";
                iconSparkle.classList.add('hidden');
                iconMove.classList.remove('hidden');
            } else {
                btn.classList.remove('btn-active');
                btnText.innerText = "ASSEMBLE";
                btnText.classList.add('text-white');
                btnText.classList.remove('text-[#E6BE8A]');
                statusText.innerText = "STATUS: AWAITING INPUT";
                iconSparkle.classList.remove('hidden');
                iconMove.classList.add('hidden');
            }
        });

        // 視窗大小調整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            foliageMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
        });

    </script>
</body>
</html>
