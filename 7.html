<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arix Luxury Geometric Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #050505; height: 100%; width: 100%; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .font-serif { font-family: 'Times New Roman', Times, serif; }
        .tracking-widest-custom { letter-spacing: 0.3em; }
        
        /* UI 動畫 */
        .fade-in { opacity: 0; animation: fadeIn 1.5s ease-out forwards 0.5s; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(-10px); } }

        /* 按鈕特效 */
        .btn-glow {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .btn-glow:hover { 
            background: rgba(255, 215, 0, 0.1); 
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .btn-active { 
            background: rgba(255, 215, 0, 0.2); 
            border-color: #FFD700; 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- UI 層 -->
    <div id="ui-layer" class="flex flex-col justify-between p-8 md:p-12 text-white select-none">
        <div class="flex flex-col items-center md:items-start space-y-2 fade-in transform translate-y-[-10px]">
            <h1 class="text-4xl md:text-6xl font-serif tracking-tighter text-[#FFD700] drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]">
                GRAND LUXURY
            </h1>
            <div class="h-[1px] w-24 bg-gradient-to-r from-[#FFD700] to-transparent"></div>
            <p class="text-xs md:text-sm font-light tracking-widest-custom uppercase text-yellow-100/60">
                Interactive Tree
            </p>
        </div>

        <div class="flex flex-col items-center space-y-6 pb-8 pointer-events-auto">
            <button id="toggle-btn" class="btn-glow group relative px-12 py-4 overflow-hidden cursor-pointer rounded-sm">
                <span id="btn-text" class="font-serif italic font-bold text-lg text-[#FFD700] transition-colors">ASSEMBLE</span>
            </button>
            <p id="status-text" class="text-[10px] text-yellow-100/30 tracking-widest font-light">
                STATUS: SCATTERED
            </p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- 配置與調色 ---
        // 這裡設定圖片中的顏色風格
        const PALETTE = {
            BG: 0x050505,
            GOLD: [
                new THREE.Color('#FFD700'), // 純金
                new THREE.Color('#FDB931'), // 深金
                new THREE.Color('#FFFACD')  // 淺香檳金
            ],
            GREEN: [
                new THREE.Color('#004225'), // 英國綠 (British Racing Green)
                new THREE.Color('#2E8B57'), // 海洋綠
                new THREE.Color('#556B2F'), // 橄欖綠
                new THREE.Color('#013220')  // 極深綠
            ]
        };

        const STATE = {
            active: false,
            mix: 0
        };

        // --- 場景初始化 ---
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PALETTE.BG);
        
        // 增強環境光反射 (讓金屬更亮)
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 25);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 10;
        controls.maxDistance = 40;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- 燈光系統 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // 主金色聚光燈 (從上方照亮)
        const mainSpot = new THREE.SpotLight(0xFFD700, 100);
        mainSpot.position.set(5, 20, 5);
        mainSpot.angle = 0.5;
        mainSpot.penumbra = 1;
        mainSpot.castShadow = true;
        scene.add(mainSpot);

        // 藍色補光 (增加層次感)
        const fillLight = new THREE.PointLight(0x004225, 20, 50);
        fillLight.position.set(-10, 0, 10);
        scene.add(fillLight);

        // --- 幾何工具 ---
        function getConePoint(radius, height, yPos) {
            const r = (yPos / height) * radius;
            const theta = Math.random() * Math.PI * 2;
            // 增加一點隨機抖動，讓樹不要太完美，像圖片一樣有些凌亂美
            const jitter = (Math.random() - 0.5) * 0.5; 
            const x = (r + jitter) * Math.cos(theta);
            const z = (r + jitter) * Math.sin(theta);
            return new THREE.Vector3(x, height - yPos - height / 2, z);
        }

        function getSpherePoint(radius) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = radius * Math.cbrt(Math.random());
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        // --- 核心系統: 幾何碎片 ---
        const dummy = new THREE.Object3D();
        const colorHelper = new THREE.Color();

        // 定義兩種粒子群：方塊 (Cubes) 和 球體 (Spheres)
        class ParticleSystem {
            constructor(count, type) {
                this.count = count;
                this.type = type; // 'cube' or 'sphere'
                this.data = [];

                let geometry, material;

                if (type === 'cube') {
                    // 金色方塊 (禮物/裝飾)
                    geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6); // 稍微大一點
                    material = new THREE.MeshStandardMaterial({
                        color: 0xffffff, // 顏色由實例控制
                        roughness: 0.1,  // 光滑
                        metalness: 0.9,  // 金屬感強
                    });
                } else {
                    // 綠色球體 (樹葉/裝飾球)
                    geometry = new THREE.SphereGeometry(0.4, 16, 16);
                    material = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        roughness: 0.3, // 稍微粗糙一點像樹葉或霧面球
                        metalness: 0.4,
                    });
                }

                this.mesh = new THREE.InstancedMesh(geometry, material, count);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

                this.init();
            }

            init() {
                for (let i = 0; i < this.count; i++) {
                    // 1. 位置計算
                    const height = 16;
                    const yNorm = Math.pow(Math.random(), 0.8); // 重心偏下
                    const yPos = yNorm * height;
                    const radius = (yPos / height) * 6.0;

                    const treePos = getConePoint(radius, height, yPos);
                    const scatterPos = getSpherePoint(18); // 散開範圍

                    // 2. 顏色分配
                    let color;
                    if (this.type === 'cube') {
                        // 金色系隨機
                        color = PALETTE.GOLD[Math.floor(Math.random() * PALETTE.GOLD.length)];
                    } else {
                        // 綠色系隨機
                        color = PALETTE.GREEN[Math.floor(Math.random() * PALETTE.GREEN.length)];
                        // 偶爾混入一點金色球體
                        if(Math.random() > 0.8) color = PALETTE.GOLD[0];
                    }
                    this.mesh.setColorAt(i, color);

                    // 3. 數據存儲
                    this.data.push({
                        treePos,
                        scatterPos,
                        // 隨機旋轉速度
                        rotSpeed: {
                            x: (Math.random() - 0.5) * 2,
                            y: (Math.random() - 0.5) * 2,
                            z: (Math.random() - 0.5) * 2
                        },
                        // 每個粒子大小不一
                        scale: Math.random() * 0.5 + 0.5,
                        // 每個粒子的運動速度略有不同
                        speed: Math.random() * 0.5 + 0.5
                    });
                    
                    // 初始位置設為散開
                    dummy.position.copy(scatterPos);
                    dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, dummy.matrix);
                }
                this.mesh.instanceColor.needsUpdate = true;
            }

            update(t, mix, active) {
                for (let i = 0; i < this.count; i++) {
                    const d = this.data[i];
                    
                    // 位置插值
                    const pos = new THREE.Vector3().lerpVectors(d.scatterPos, d.treePos, mix);

                    // 懸浮動畫 (Floating)
                    const hover = Math.sin(t * d.speed + i) * 0.3 * (active ? 0.2 : 1.0); // 樹型態時動靜較小
                    pos.y += hover;

                    dummy.position.copy(pos);
                    
                    // 旋轉動畫 (Tumbling)
                    dummy.rotation.x = t * d.rotSpeed.x;
                    dummy.rotation.y = t * d.rotSpeed.y;
                    dummy.rotation.z = t * d.rotSpeed.z;

                    // 縮放動畫 (聚合時變大一點點，更有份量感)
                    const s = d.scale * (0.8 + 0.2 * mix);
                    dummy.scale.set(s, s, s);

                    dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, dummy.matrix);
                }
                this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        // 創建粒子系統
        // 1200個綠色球體構成樹的主體，600個金色方塊作為點綴
        const sphereSystem = new ParticleSystem(1200, 'sphere');
        const cubeSystem = new ParticleSystem(600, 'cube');

        const group = new THREE.Group();
        group.position.y = -2;
        group.add(sphereSystem.mesh);
        group.add(cubeSystem.mesh);
        scene.add(group);


        // --- 頂部星星 (保持簡約奢華) ---
        const starGeo = new THREE.OctahedronGeometry(0.8, 0);
        const starMat = new THREE.MeshStandardMaterial({ 
            color: 0xFFD700, 
            emissive: 0xFFD700,
            emissiveIntensity: 2.0 
        });
        const star = new THREE.Mesh(starGeo, starMat);
        const starGroup = new THREE.Group();
        starGroup.add(star);
        starGroup.position.set(0, 7, 0);
        scene.add(starGroup);

        // --- 後期處理 (Bloom 輝光) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // 參數調整：讓金色更閃耀，但不要讓畫面糊成一團
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.5; // 只有亮部發光
        bloomPass.strength = 1.0;  // 強度適中
        bloomPass.radius = 0.4;
        composer.addPass(bloomPass);

        // --- 動畫循環 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // 狀態平滑過渡
            const targetMix = STATE.active ? 1.0 : 0.0;
            // 讓聚合速度慢一點，更有儀式感 (0.02)
            STATE.mix += (targetMix - STATE.mix) * 0.02;

            // 更新粒子
            sphereSystem.update(t, STATE.mix, STATE.active);
            cubeSystem.update(t, STATE.mix, STATE.active);

            // 星星動畫
            starGroup.position.y = THREE.MathUtils.lerp(20, 6.5, STATE.mix); // 星星從天而降
            starGroup.rotation.y = t;
            starGroup.scale.setScalar(STATE.mix); // 散開時消失

            // 相機旋轉控制
            if(STATE.active) {
                controls.autoRotateSpeed = 2.0; // 聚合時旋轉快一點展示
            } else {
                controls.autoRotateSpeed = 0.5; // 散開時慢速漂浮
            }
            controls.update();

            composer.render();
        }

        animate();

        // --- 交互邏輯 ---
        const btn = document.getElementById('toggle-btn');
        const btnText = document.getElementById('btn-text');
        const statusText = document.getElementById('status-text');

        btn.addEventListener('click', () => {
            STATE.active = !STATE.active;
            
            if (STATE.active) {
                btn.classList.add('btn-active');
                btnText.innerText = "SCATTER";
                statusText.innerText = "STATUS: LUXURY FORM";
            } else {
                btn.classList.remove('btn-active');
                btnText.innerText = "ASSEMBLE";
                statusText.innerText = "STATUS: FLOATING DEBRIS";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
